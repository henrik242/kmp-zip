name: CodeQL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

jobs:
  analyze:
    name: Analyze (kotlin)
    runs-on: macos-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-disabled: true
      - uses: github/codeql-action/init@v4
        with:
          languages: kotlin
      # CodeQL traces a real compiler invocation, so cache hits leave the database empty
      - run: ./gradlew --no-build-cache --rerun-tasks jvmTestClasses
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
